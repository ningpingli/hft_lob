task:
  ticker: "688981"
  task_type: regression

data:
  levels: 5
  snapshot_interval_seconds: 3
  raw_dir: /data/lnp/data/raw
  column_mapping:
    a1: ASKp1
    a1_v: ASKs1
    b1: BIDp1
    b1_v: BIDs1
    a2: ASKp2
    a2_v: ASKs2
    b2: BIDp2
    b2_v: BIDs2
    a3: ASKp3
    a3_v: ASKs3
    b3: BIDp3
    b3_v: BIDs3
    a4: ASKp4
    a4_v: ASKs4
    b4: BIDp4
    b4_v: BIDs4
    a5: ASKp5
    a5_v: ASKs5
    b5: BIDp5
    b5_v: BIDs5
    last: last
    volume: volume
    amount: amount

cleaning:
  max_ffill_gap_seconds: 6
target:
  type: log_mid_return
  horizon_seconds: 60
  tolerance_seconds: 3
sessions:
  morning: ["09:30:00", "11:30:00"]
  afternoon: ["13:00:00", "14:57:00"]
  allow_cross_session: false
window:
  history_snapshots: 180
  include_anchor_snapshot: true
features:
  use_derived: false
normalization:
  mode: causal_rolling
  normalize_window: 180
split:
  strategy: chronological
  train_ratio: 0.6
  validation_ratio: 0.2
walk_forward:
  enabled: true
  train_window_days: 60
  validation_window_days: 20
  test_window_days: 20
  step_days: 20
