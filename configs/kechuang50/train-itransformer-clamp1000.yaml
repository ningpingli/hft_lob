# iTransformer 数值稳定判别实验:feature_clip=1000(对 688008 近似 no-op)。
# 目的:区分 clamp 阈值截断代价 vs 训练轨迹噪声(与 -clamp 版 ±100 对比)。
loader:
  batch_size: 128
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null
model:
  name: itransformer
  feature_clip: 1000.0
training:
  loss: huber
  loss_huber_delta: 1.0
  epochs: 50
  patience: 10
  monitor_metric: val/mean_daily_ic
  monitor_mode: max
  learning_rate: 0.001
  min_learning_rate: 1.0e-05
  scheduler: cosine
  warmup_ratio: 0.1
  gradient_clip_val: 1.0
  betas:
  - 0.9
  - 0.95
  weight_decay: 1.0e-05
  log_interval_epochs: 1
evaluation:
  prediction_bins: 10
folds:
  start_fold: 1
  num_folds: 2
seed: 42
