loader:
  batch_size: 128
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null
model:
  name: deeplob
training:
  loss: huber
  loss_huber_delta: 1.0
  epochs: 50
  patience: 10
  monitor_metric: val/mean_daily_ic
  monitor_mode: max
  learning_rate: 0.001
  betas:
  - 0.9
  - 0.95
  weight_decay: 1.0e-05
  log_interval_epochs: 1
evaluation:
  prediction_bins: 10
folds:
  start_fold: 1
  num_folds: 2
seed: 42
