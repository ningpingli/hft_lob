# Default training template for DeepLOB.
loader:
  batch_size: 128
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null

model:
  name: deeplob


training:
  loss: huber
  loss_huber_delta: 1.0
  epochs: 50
  patience: 10
  monitor_metric: val/mse
  monitor_mode: min
  learning_rate: 0.001
  betas: [0.9, 0.95]
  weight_decay: 0.00001
  log_interval_epochs: 1

evaluation:
  prediction_bins: 10

folds:
  start_fold: 1
  num_folds: null

seed: 42
